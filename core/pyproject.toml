[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessguard-core"
version = "0.1.0"
description = "Shared HarnessGuard package: config, db, schema, seed, tasks, telemetry events"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
include = ["harnessguard_core*"]

[tool.setuptools.package-data]
harnessguard_core = ["schema.sql"]
