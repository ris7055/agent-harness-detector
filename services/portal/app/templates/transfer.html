{% extends "base.html" %}
{% block title %}Transfer · Bank Seroja{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-8">
  <h1 class="text-xl font-semibold text-slate-900 mb-1">Transfer money</h1>
  <p class="text-sm text-slate-500 mb-6">Available balance: <strong>{{ account.balance_cents | rm }}</strong></p>
  {% if error %}
  <div class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">{{ error }}</div>
  {% endif %}
  <form method="post" action="/transfer" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="to_name">Recipient name</label>
      <input class="w-full rounded-lg border border-slate-300 px-3 py-2" id="to_name" name="to_name"
             value="{{ form.to_name if form else '' }}" required>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="to_bank">Recipient bank</label>
      <select class="w-full rounded-lg border border-slate-300 px-3 py-2 bg-white" id="to_bank" name="to_bank" required>
        <option value="" disabled {{ 'selected' if not form }}>Choose a bank…</option>
        {% for b in banks %}
        <option value="{{ b }}" {{ 'selected' if form and form.to_bank == b }}>{{ b }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="to_account">Recipient account number</label>
      <input class="w-full rounded-lg border border-slate-300 px-3 py-2" id="to_account" name="to_account"
             inputmode="numeric" value="{{ form.to_account if form else '' }}" required>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="amount">Amount (RM)</label>
      <input class="w-full rounded-lg border border-slate-300 px-3 py-2" id="amount" name="amount"
             inputmode="decimal" placeholder="0.00" value="{{ form.amount if form else '' }}" required>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="reference">Reference (optional)</label>
      <input class="w-full rounded-lg border border-slate-300 px-3 py-2" id="reference" name="reference"
             maxlength="60" value="{{ form.reference if form else '' }}">
    </div>
    <button class="w-full rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-2.5"
            type="submit">Review transfer</button>
  </form>
</div>
{% endblock %}
