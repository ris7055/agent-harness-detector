{% extends "base.html" %}
{% block title %}Sign in · Bank Seroja{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-8">
  <h1 class="text-xl font-semibold text-slate-900 mb-1">Sign in to online banking</h1>
  <p class="text-sm text-slate-500 mb-6">Welcome back to Bank Seroja.</p>
  {% if error %}
  <div class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" id="login-form" class="space-y-4">
    <input type="hidden" name="next" value="{{ next or '/dashboard' }}">
    <input type="hidden" name="hg_last_seq" id="hg_last_seq" value="0">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="username">Username</label>
      <input class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600"
             id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="password">Password</label>
      <input class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600"
             id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="w-full rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-2.5"
            type="submit">Sign in</button>
  </form>
  <p class="mt-4 text-xs text-slate-400">Demo users: aisyah, daniel, meiling, ravi, demo — password <code>Seroja@2026</code>.</p>
</div>
{% endblock %}
