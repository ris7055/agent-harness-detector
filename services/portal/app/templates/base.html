<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="hg-session" content="{{ hg_session }}">
  <title>{% block title %}Bank Seroja{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">
  <div class="bg-amber-400 text-amber-950 text-center text-xs font-semibold tracking-wide py-1.5 px-3">
    DEMO — fictional bank · no real money, accounts or personal data
  </div>
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/dashboard" class="flex items-center gap-2">
        <span class="inline-block w-8 h-8 rounded-lg bg-emerald-700 text-white font-bold flex items-center justify-center">S</span>
        <span class="text-lg font-semibold tracking-tight text-slate-900">Bank Seroja</span>
      </a>
      {% if user %}
      <nav class="flex items-center gap-4 text-sm">
        <a class="text-slate-600 hover:text-slate-900" href="/dashboard">Dashboard</a>
        <a class="text-slate-600 hover:text-slate-900" href="/transfer">Transfer</a>
        <a class="text-slate-600 hover:text-slate-900" href="/loan">Loan</a>
        <span class="text-slate-400">|</span>
        <span class="text-slate-500">{{ user.full_name }}</span>
        <a class="text-emerald-700 hover:underline" href="/logout">Log out</a>
      </nav>
      {% endif %}
    </div>
  </header>
  <main class="flex-1 w-full max-w-3xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="text-center text-xs text-slate-400 pb-6">
    Bank Seroja is a fictional bank built for a fraud-detection demo.
  </footer>
</body>
</html>
