{% extends "base.html" %}
{% block title %}Apply for a loan · Bank Seroja{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-8">
  <h1 class="text-xl font-semibold text-slate-900 mb-1">Personal loan application</h1>
  <p class="text-sm text-slate-500 mb-6">Tell us a little about the financing you need.</p>
  {% if error %}
  <div class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">{{ error }}</div>
  {% endif %}
  <form method="post" action="/loan" class="space-y-4">
    <input type="hidden" name="hg_last_seq" id="hg_last_seq" value="0">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="amount">Loan amount (RM)</label>
      <input class="w-full rounded-lg border border-slate-300 px-3 py-2" id="amount" name="amount"
             inputmode="decimal" placeholder="10000" required>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="tenure_months">Tenure (months)</label>
      <select class="w-full rounded-lg border border-slate-300 px-3 py-2 bg-white" id="tenure_months" name="tenure_months" required>
        {% for m in [12, 24, 36, 48, 60] %}<option value="{{ m }}">{{ m }} months</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="monthly_income">Monthly income (RM)</label>
      <input class="w-full rounded-lg border border-slate-300 px-3 py-2" id="monthly_income" name="monthly_income"
             inputmode="decimal" placeholder="4500" required>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="employer">Employer</label>
      <input class="w-full rounded-lg border border-slate-300 px-3 py-2" id="employer" name="employer" required>
    </div>
    <button class="w-full rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-2.5"
            type="submit">Submit application</button>
  </form>
</div>
{% endblock %}
