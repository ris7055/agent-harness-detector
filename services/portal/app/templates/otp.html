{% extends "base.html" %}
{% block title %}Verify · Bank Seroja{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-8">
  <h1 class="text-xl font-semibold text-slate-900 mb-1">Verify it's you</h1>
  <p class="text-sm text-slate-500 mb-4">{{ message }}</p>

  <div class="mb-4 rounded-lg bg-sky-50 border border-sky-200 text-sky-800 text-sm px-4 py-3 flex items-start justify-between gap-3">
    <span>SMS simulation: your code is <strong class="font-mono">{{ otp_code }}</strong></span>
    <button type="button" onclick="this.parentElement.remove()"
            class="text-sky-400 hover:text-sky-700 font-bold leading-none">&times;</button>
  </div>

  {% if error %}
  <div class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">{{ error }}</div>
  {% endif %}

  <form method="post" action="/otp" class="space-y-4">
    <input type="hidden" name="kind" value="{{ kind }}">
    <input type="hidden" name="item_id" value="{{ item_id }}">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="otp">6-digit code</label>
      <input class="w-full rounded-lg border border-slate-300 px-3 py-2 font-mono tracking-widest text-lg"
             id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
             autocomplete="one-time-code" required autofocus>
    </div>
    <button class="w-full rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-2.5"
            type="submit">Verify</button>
  </form>
</div>
{% endblock %}
